<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }
    .splash {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; width: 100%; gap: 16px;
      box-sizing: border-box;
      overflow: hidden;
      background: #090d16;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .logo {
      width: 56px; height: 56px; border-radius: 14px;
      background: #10b981;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 24px;
      box-shadow: 0 8px 24px rgba(16,185,129,0.3);
    }
    .title { color: #f1f5f9; font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
    .subtitle { color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    .spinner {
      width: 22px; height: 22px;
      border: 3px solid rgba(16,185,129,0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">M</div>
    <div class="title">MEAT SHOP POS</div>
    <div class="spinner"></div>
    <div class="subtitle">Starting up</div>
  </div>
</body>
</html>
